<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard · Tamon</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <img src="/icons/tamon.svg" alt="Tamon" class="hero-icon" />
        <div>
          <h1>Panel Admin</h1>
          <p class="subtitle">Uso, aprendizaje y gestión de usuarios de Tamon.</p>
        </div>
      </header>

      <section class="panel kpi-grid">
        <article class="kpi-card"><h3>Total traducciones</h3><p id="kpi-translations">-</p></article>
        <article class="kpi-card"><h3>Usuarios activos</h3><p id="kpi-users">-</p></article>
        <article class="kpi-card"><h3>Progreso aprendizaje</h3><p id="kpi-learning">-</p></article>
      </section>

      <section class="panel profile-grid">
        <div>
          <h2>Idiomas más usados</h2>
          <canvas id="language-chart"></canvas>
        </div>
        <div>
          <h2>Tipos de archivo</h2>
          <canvas id="filetype-chart"></canvas>
        </div>
      </section>

      <section class="panel">
        <h2>Usuarios</h2>
        <form id="user-filters" class="grid-form">
          <label>Búsqueda<input id="filter-search" placeholder="nombre o correo" /></label>
          <label>Plan
            <select id="filter-plan">
              <option value="">Todos</option>
              <option value="free">Free</option>
              <option value="pro_plus">Pro Plus</option>
            </select>
          </label>
          <label>Estado
            <select id="filter-status">
              <option value="">Todos</option>
              <option value="active">Activo</option>
              <option value="blocked">Bloqueado</option>
            </select>
          </label>
          <button class="btn-primary" type="submit">Aplicar filtros</button>
        </form>
        <div id="users-table" class="table-scroll"></div>
      </section>

      <section class="panel">
        <h2>Sugerencias de corrección pendientes</h2>
        <div id="suggestions-list"></div>
      </section>
    </main>
    <script src="/admin.js"></script>
  </body>
</html>
