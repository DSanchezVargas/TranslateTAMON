<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi Perfil · Tamon</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <img src="/icons/tamon.svg" alt="Tamon" class="hero-icon" />
        <div>
          <h1>Mi Perfil</h1>
          <p class="subtitle">Gestiona tus datos, plan, contraseña e historial.</p>
        </div>
      </header>

      <section class="panel profile-grid">
        <div>
          <h2>Datos personales</h2>
          <form id="profile-form" class="grid-form">
            <label>Nombre<input id="profile-name" required /></label>
            <label>Correo<input id="profile-email" type="email" required /></label>
            <button class="btn-primary" type="submit">Guardar cambios</button>
          </form>
          <form id="password-form" class="grid-form" style="margin-top: 1rem;">
            <label>Contraseña actual<input id="current-password" type="password" required /></label>
            <label>Nueva contraseña<input id="new-password" type="password" minlength="8" required /></label>
            <button class="btn-secondary" type="submit">Cambiar contraseña</button>
          </form>
          <form id="avatar-form" style="margin-top: 1rem;">
            <label>Foto de perfil<input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp" /></label>
            <button class="btn-primary" type="submit">Subir avatar</button>
          </form>
        </div>
        <aside>
          <h2>Plan y cuotas</h2>
          <p id="profile-plan">Cargando...</p>
          <p id="profile-quota"></p>
          <img id="profile-avatar" alt="Avatar" class="profile-avatar" />
          <a class="btn-secondary" href="/">Volver al inicio</a>
        </aside>
      </section>

      <section class="panel">
        <h2>Historial de traducciones</h2>
        <div id="history-list" class="table-scroll"></div>
      </section>
    </main>
    <script src="/profile.js"></script>
  </body>
</html>
